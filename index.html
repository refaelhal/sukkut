<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל רשימת סוכות</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        
        /* Smooth fade in for modals */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-animate {
            animation: fadeIn 0.2s ease-out forwards;
        }

        /* Custom Scrollbar for better look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #22c55e; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #16a34a; 
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen">
    <div class="max-w-4xl mx-auto p-4 md:p-8 pb-24">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-green-100">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="bg-green-100 text-green-600 p-3 rounded-full">
                    <i class="fa-solid fa-hammer text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">מנהל בניית סוכות</h1>
                    <p class="text-sm text-gray-500">ארגן את הלקוחות ושתף בקלות</p>
                </div>
            </div>
            
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="copyToWhatsApp()" class="flex-1 md:flex-none bg-green-500 hover:bg-green-600 text-white px-5 py-2.5 rounded-xl font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    העתק לוואטסאפ
                </button>
                <button onclick="openModal()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus text-sm"></i>
                    איש חדש
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Scheduled Section -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center gap-2 mb-4 border-b pb-3">
                    <i class="fa-regular fa-calendar-check text-green-500 text-xl"></i>
                    <h2 class="text-xl font-bold text-gray-800">נקבעו שעות (<span id="scheduled-count">0</span>)</h2>
                </div>
                <div id="scheduled-list" class="space-y-4"></div>
            </div>

            <!-- Unscheduled Section -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-center gap-2 mb-4 border-b pb-3">
                    <i class="fa-solid fa-hourglass-half text-orange-400 text-xl"></i>
                    <h2 class="text-xl font-bold text-gray-800">טרם נקבעו (<span id="unscheduled-count">0</span>)</h2>
                </div>
                <div id="unscheduled-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="person-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md modal-animate overflow-hidden">
            <div class="bg-gray-50 border-b p-4 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">הוסף איש חדש</h3>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="person-form" onsubmit="savePerson(event)" class="p-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שם מלא</label>
                    <input type="text" name="name" required class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="לדוגמה: ישראל ישראלי">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">טלפון</label>
                    <input type="text" name="phone" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="לדוגמה: 050-1234567">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">כתובת</label>
                    <input type="text" name="address" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="לדוגמה: הרצל 1, תל אביב">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שעה שנקבעה (השאר ריק אם לא נקבע)</label>
                    <input type="text" name="time" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="לדוגמה: יום חמישי ב-16:00">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">הערות</label>
                    <textarea name="note" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="לדוגמה: להביא סולם..." rows="2"></textarea>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-xl transition-colors">שמור</button>
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 rounded-xl transition-colors">ביטול</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg items-center gap-3 z-50 modal-animate">
        <i class="fa-solid fa-check-circle text-green-400"></i>
        <span id="toast-message"></span>
    </div>

    <script>
        const initialData = [
            { id: '1', name: 'ציונה זמרי', phone: '058-5045747', address: 'מפרץ אילת 2/5', time: 'יום שישי 18/9, 11:00', note: '' },
            { id: '2', name: 'שיראל אלבז', phone: '052-5590704', address: 'המוריה 13ב’, דירה 9', time: 'יום ראשון בבוקר', note: '' },
            { id: '3', name: 'יצחק אלוני', phone: '054-3502246', address: 'דרך עפרון 3/1, אריאל', time: 'רביעי או חמישי שבוע הבא, שעות הצהריים', note: '' },
            { id: '4', name: 'שולמית', phone: '050-6386376', address: 'ברק 21/7', time: '', note: '' },
            { id: '5', name: 'טלי קדוש', phone: '054-5654172', address: 'הירדן, דירה 19', time: '', note: '' },
            { id: '6', name: 'רמולה איושמן', phone: '055-3040465', address: 'אוניברסיטה, אריאל', time: '', note: '' },
            { id: '7', name: 'לילי אברהם', phone: '050-6686808', address: 'האצ"ל 2/4', time: '', note: '' },
            { id: '8', name: 'אליה ספנוב', phone: '050-7742585', address: 'משעול ז\' 32/5', time: '', note: '' },
            { id: '9', name: 'לקוח לבירור', phone: '054-2212267', address: '', time: '', note: 'לבדוק אם אפשר מחר (ללא שם)' }
        ];

        let people = [];
        try {
            const saved = localStorage.getItem('sukkah_people');
            people = saved ? JSON.parse(saved) : initialData;
        } catch(e) {
            people = initialData;
        }

        let currentEditId = null;
        let toastTimeout = null;

        function saveToLocalStorage() {
            localStorage.setItem('sukkah_people', JSON.stringify(people));
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 3000);
        }

        function openModal(id = null) {
            currentEditId = id;
            const modal = document.getElementById('person-modal');
            const form = document.getElementById('person-form');
            
            if (id) {
                const person = people.find(p => p.id === id);
                document.getElementById('modal-title').textContent = 'ערוך פרטים';
                form.elements['name'].value = person.name || '';
                form.elements['phone'].value = person.phone || '';
                form.elements['address'].value = person.address || '';
                form.elements['time'].value = person.time || '';
                form.elements['note'].value = person.note || '';
            } else {
                document.getElementById('modal-title').textContent = 'הוסף איש חדש';
                form.reset();
            }
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('person-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            currentEditId = null;
        }

        function savePerson(event) {
            event.preventDefault();
            const form = document.getElementById('person-form');
            const name = form.elements['name'].value.trim();
            if (!name) return;

            const personData = {
                name,
                phone: form.elements['phone'].value.trim(),
                address: form.elements['address'].value.trim(),
                time: form.elements['time'].value.trim(),
                note: form.elements['note'].value.trim()
            };

            if (currentEditId) {
                people = people.map(p => p.id === currentEditId ? { ...p, ...personData } : p);
            } else {
                people.push({ ...personData, id: Math.random().toString(36).substr(2, 9) });
            }

            saveToLocalStorage();
            render();
            closeModal();
        }

        function deletePerson(id) {
            if (window.confirm('האם אתה בטוח שברצונך למחוק רשומה זו?')) {
                people = people.filter(p => p.id !== id);
                saveToLocalStorage();
                render();
            }
        }

        function createCard(person) {
            return `
            <div class="bg-gray-50 border border-gray-100 rounded-xl p-4 hover:shadow-md transition-shadow group relative">
                <div class="absolute top-4 left-4 flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                    <button onclick="openModal('${person.id}')" class="w-8 h-8 flex items-center justify-center rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 transition-colors" title="ערוך">
                        <i class="fa-solid fa-pen text-sm"></i>
                    </button>
                    <button onclick="deletePerson('${person.id}')" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-100 text-red-600 hover:bg-red-200 transition-colors" title="מחק">
                        <i class="fa-solid fa-trash text-sm"></i>
                    </button>
                </div>

                <h3 class="font-bold text-lg text-gray-800 mb-2 pl-20">${escapeHTML(person.name)}</h3>
                
                <div class="space-y-1.5 text-sm text-gray-600">
                    ${person.time ? `
                    <div class="flex items-start gap-2">
                        <i class="fa-regular fa-clock mt-1 text-green-600 w-4 text-center"></i>
                        <span class="font-medium text-gray-800">${escapeHTML(person.time)}</span>
                    </div>` : ''}
                    ${person.phone ? `
                    <div class="flex items-start gap-2">
                        <i class="fa-solid fa-phone mt-1 text-gray-400 w-4 text-center"></i>
                        <a href="tel:${escapeHTML(person.phone)}" class="hover:text-blue-600 transition-colors" dir="ltr">${escapeHTML(person.phone)}</a>
                    </div>` : ''}
                    ${person.address ? `
                    <div class="flex items-start gap-2">
                        <i class="fa-solid fa-location-dot mt-1 text-gray-400 w-4 text-center"></i>
                        <span>${escapeHTML(person.address)}</span>
                    </div>` : ''}
                    ${person.note ? `
                    <div class="flex items-start gap-2 mt-2 pt-2 border-t border-gray-100">
                        <i class="fa-regular fa-comment-dots mt-1 text-orange-400 w-4 text-center"></i>
                        <span class="text-gray-600">${escapeHTML(person.note)}</span>
                    </div>` : ''}
                </div>
                
                ${person.phone ? `
                <div class="mt-4">
                    <a href="tel:${escapeHTML(person.phone)}" class="w-full bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors shadow-sm">
                        <i class="fa-solid fa-phone"></i>
                        התקשר
                    </a>
                </div>` : ''}
            </div>`;
        }

        function render() {
            const scheduled = people.filter(p => p.time.trim() !== '');
            const unscheduled = people.filter(p => p.time.trim() === '');

            document.getElementById('scheduled-count').textContent = scheduled.length;
            document.getElementById('unscheduled-count').textContent = unscheduled.length;

            const scheduledList = document.getElementById('scheduled-list');
            const unscheduledList = document.getElementById('unscheduled-list');

            scheduledList.innerHTML = scheduled.length ? scheduled.map(createCard).join('') : '<p class="text-gray-400 text-center py-4">אין אנשים שנקבעה להם שעה.</p>';
            unscheduledList.innerHTML = unscheduled.length ? unscheduled.map(createCard).join('') : '<p class="text-gray-400 text-center py-4">כולם שובצו!</p>';
        }

        function copyToWhatsApp() {
            const scheduled = people.filter(p => p.time.trim() !== '' && !p.name.includes('בירור'));
            const unscheduled = people.filter(p => p.time.trim() === '' && !p.name.includes('בירור'));
            const toClarify = people.filter(p => p.name.includes('בירור'));

            let text = "📋 *רשימת נרשמים לבניית סוכות* 📋\n\n";

            if (scheduled.length > 0) {
                text += "🗓️ *נקבעו שעות:*\n\n";
                scheduled.forEach(p => {
                    text += `👤 *${p.name}*\n`;
                    if (p.phone) text += `📞 ${p.phone}\n`;
                    if (p.address) text += `📍 ${p.address}\n`;
                    if (p.time) text += `📆 ${p.time}\n`;
                    if (p.note) text += `📝 ${p.note}\n`;
                    text += "\n";
                });
            }

            if (unscheduled.length > 0) {
                if (scheduled.length > 0) text += "➖➖➖➖➖➖➖➖\n\n";
                text += "⏳ *טרם נקבעו שעות:*\n\n";
                unscheduled.forEach(p => {
                    text += `👤 *${p.name}*\n`;
                    if (p.phone) text += `📞 ${p.phone}\n`;
                    if (p.address) text += `📍 ${p.address}\n`;
                    if (p.note) text += `📝 ${p.note}\n`;
                    text += "\n";
                });
            }

            if (toClarify.length > 0) {
                if (scheduled.length > 0 || unscheduled.length > 0) text += "➖➖➖➖➖➖➖➖\n\n";
                text += "📌 *לבירור ומעקב:*\n\n";
                toClarify.forEach(p => {
                    if (p.phone && p.note) {
                        text += `📞 *${p.phone}* – ${p.note}\n\n`;
                    } else {
                        text += `👤 *${p.name}*\n`;
                        if (p.phone) text += `📞 ${p.phone}\n`;
                        if (p.note) text += `📝 ${p.note}\n`;
                        text += "\n";
                    }
                });
            }

            text = text.trim();

            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("הרשימה הועתקה בהצלחה! אפשר להדביק בוואטסאפ.");
            } catch (err) {
                showToast("שגיאה בהעתקה, אנא נסה שוב.");
            }
            document.body.removeChild(textArea);
        }

        // Initialize the app on page load
        render();
    </script>
</body>
</html>
